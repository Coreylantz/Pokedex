  <circle cx="15" cy="14" r="2.5" fill="#bfe6fb" />

  <circle cx="33" cy="13" r="3" fill="#f0524a" />
  <circle cx="42" cy="13" r="3" fill="#f2d045" />
  <circle cx="51" cy="13" r="3" fill="#4fd07f" />

