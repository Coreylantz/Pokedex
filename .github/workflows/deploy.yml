name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Without the secrets configured this job would fail on every push and
    # turn the whole repo red. Skipping is honest: nothing is deployed, and
    # nothing pretends otherwise.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    permissions:
      contents: read
      deployments: write
      # Lets the action leave the preview URL on the pull request.
      pull-requests: write

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The dex data and the subsetted fonts are committed, so this needs no
      # network beyond the registry — the build is reproducible offline.
      - run: pnpm build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `main` becomes the production URL; every other branch gets its own
          # preview URL, which is the useful part for testing on a phone.
          command: >-
            pages deploy dist
            --project-name=pokedex
            --branch=${{ github.head_ref || github.ref_name }}
